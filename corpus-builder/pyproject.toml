[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sibyl-corpus-builder"
version = "0.4.2"
description = "Local build-time corpus preparation tool for Sibyl"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
ml = [
  "numpy==1.26.4",
  "torch==2.2.2",
  "sentence-transformers==3.4.1",
]

[project.scripts]
sibyl-corpus = "sibyl_corpus_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
