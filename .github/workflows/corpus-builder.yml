name: corpus-builder

on:
  push:
    paths:
      - "corpus-builder/**"
      - "corpus-format/**"
      - "test-corpus/**"
      - ".github/workflows/corpus-builder.yml"
  pull_request:
    paths:
      - "corpus-builder/**"
      - "corpus-format/**"
      - "test-corpus/**"
      - ".github/workflows/corpus-builder.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
        working-directory: corpus-builder
      - run: python -m pytest
        working-directory: corpus-builder
      - run: python corpus-format/tools/validate_schema.py
